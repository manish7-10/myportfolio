<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vanilla JS Image Slider</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="page">
    <h1 class="page-title">Vanilla JS Image Slider Library</h1>

    <!-- Root node the slider library mounts into -->
    <div class="slider" data-slider>
      <div class="slider__window">
        <div class="slider__track" data-slider-track>
          <div class="slider__slide">
            <img src="/mountain1.jpg" alt="Hiker overlooking a sea of clouds and snow-capped peaks" draggable="false" />
          </div>
          <div class="slider__slide">
            <img src="/mountain2.jpg" alt="Hiker resting on a ridge with snow-capped mountains behind" draggable="false" />
          </div>
          <div class="slider__slide">
            <img src="/mountain3.jpg" alt="Hiker with arms raised on a ridge facing a wide Himalayan panorama" draggable="false" />
          </div>
          <div class="slider__slide">
            <img src="/mountain4.jpg" alt="Hiker looking out over green hills toward distant snow peaks under a blue sky" draggable="false" />
          </div>
        </div>

        <button class="slider__arrow slider__arrow--prev" data-slider-prev aria-label="Previous slide">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="slider__arrow slider__arrow--next" data-slider-next aria-label="Next slide">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M9 18l6-6-6-6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>

      <!-- Indicator dots are generated dynamically by slider.js -->
      <div class="slider__dots" data-slider-dots></div>
    </div>

  </main>

  <script src="slider.js"></script>
  <script>
    // Initialize the slider library on the container(s) found on the page.
    document.addEventListener('DOMContentLoaded', () => {
      new ImageSlider(document.querySelector('[data-slider]'), {
        loop: true,
        transitionMs: 500
      });
    });
  </script>
</body>
</html>
